<div class="translator">
  <div class="translator-header">
    <h3>Tradução</h3>
  </div>

  @if (!supported) {
    <div class="translator-fallback">
      Seu navegador não oferece suporte à tradução nativa. Use o Chrome 138 ou
      superior (com a Translator API habilitada) para traduzir textos.
    </div>
  } @else {
    <div class="language-selects">
      <label class="select-label">
        De
        <select [(ngModel)]="source" [disabled]="isProcessing">
          @if (canDetect) {
            <option value="auto">Auto</option>
          }
          @for (lang of languages; track lang.code) {
            <option [value]="lang.code">{{ lang.label }}</option>
          }
        </select>
      </label>

      <label class="select-label">
        Para
        <select [(ngModel)]="target" [disabled]="isProcessing">
          @for (lang of languages; track lang.code) {
            <option [value]="lang.code">{{ lang.label }}</option>
          }
        </select>
      </label>
    </div>

    <div class="translate-actions">
      <button
        class="translate-button"
        (click)="onTranslate()"
        [disabled]="!canTranslate"
      >
        @if (isProcessing) {
          <span>Traduzindo...</span>
        } @else {
          <span>🌐 Traduzir</span>
        }
      </button>
    </div>
  }

  @if (errorMessage) {
    <div class="error">
      {{ errorMessage }}
    </div>
  }

  @if (translatedText && !errorMessage) {
    <div class="translation-result">
      <div class="translation-text">{{ translatedText }}</div>
      <button
        class="copy-button"
        (click)="onCopyTranslated()"
        [disabled]="isProcessing"
      >
        @if (copyStatus === 'copied') {
          <span>✔ Copiado!</span>
        } @else if (copyStatus === 'error') {
          <span>Erro ao copiar</span>
        } @else {
          <span>📋 Copiar tradução</span>
        }
      </button>
    </div>
  }
</div>
