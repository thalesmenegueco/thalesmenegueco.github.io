<section class="lab">
  <header class="page-head">
    <p class="eyebrow">Ferramentas</p>
    <h1>Lab de ferramentas</h1>
    <p>
      Sete experimentos que resolvem problemas reais — todos rodando no seu
      navegador, sem enviar seus dados para lugar nenhum.
    </p>
  </header>

  <div class="lab__grid">
    @for (tool of tools; track tool.slug) {
      <app-tool-card [tool]="tool" />
    }
  </div>

  <p class="lab__back">
    <a class="button button--quiet" routerLink="/">← Voltar ao início</a>
  </p>
</section>
