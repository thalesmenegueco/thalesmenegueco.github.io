name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para escrever no repositório
      pages: write    # Permissão para gerenciar o GitHub Pages
      id-token: write # Necessário para autenticação OIDC (boas práticas)

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Read from `.nvmrc` rather than repeating a version here. This workflow
        # used to hard-code `24`, while `package.json`'s `engines.node` and
        # `.nvmrc` both say 22 — and Vercel builds the platform on the pinned 22.
        # That is three places to keep in sync, and the drift was already real:
        # CI was the only place building on 24. One file now governs all of them.
        node-version-file: '.nvmrc'
        # `npm ci` was re-downloading every dependency on every deploy.
        cache: 'npm'

    - name: Install dependencies
      run: npm ci


    - name: Build Angular App
      run: npx ng build portfolio --configuration production --base-href /

    - name: Copy index.html to 404.html for SPA routing
      run: cp ./dist/portfolio/browser/index.html ./dist/portfolio/browser/404.html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist/portfolio/browser # Location of the folder to published
        publish_branch: gh-pages
