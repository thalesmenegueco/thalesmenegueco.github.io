name: CI — build and test both apps

# Phase 5's PR guard. Until this existed, nothing checked that a change to
# `libs/` — which both apps import as source, not as built packages — left the
# other app compiling. Phase 2 put them on shared source on purpose, so skipping
# this check would have made the split dishonest: the portfolio is deployed by
# `deploy.yml` and the platform by Vercel, and each only ever built its own app.
#
# Scope note: `pull_request` is the trigger the plan asked for. A push to `main`
# is deliberately *not* listed, because it is already covered by two real builds —
# `deploy.yml` builds `portfolio` for Pages, and Vercel builds `ml-platform` from
# `vercel.json`. Re-running both here would add a third copy of the same work.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege: this workflow reads the repository and runs tests. It never
# writes to it and never deploys, unlike `deploy.yml`.
permissions:
  contents: read

# A new push to the same PR makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      # Report both apps even when one fails: "which app broke" is the whole
      # question this workflow exists to answer, and fail-fast hides half of it.
      fail-fast: false
      matrix:
        app: [ portfolio, ml-platform ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `ChromeHeadlessNoSandbox` is a launcher the `@angular/build:karma` builder
      # defines itself (base `ChromeHeadless` plus `--no-sandbox`,
      # `--disable-gpu`, `--disable-dev-shm-usage`). Using it instead of adding a
      # `karma.conf.js` per app is the difference between one flag here and two
      # new config files to maintain. GitHub's runners already ship Chrome, so no
      # browser setup step is needed.
      - name: Test ${{ matrix.app }}
        run: npx ng test ${{ matrix.app }} --watch=false --browsers=ChromeHeadlessNoSandbox

  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ portfolio, ml-platform ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The exact production command each host runs. `ml-platform` is built
      # without `--base-href`, because it is deployed at the root of its own
      # domain; `portfolio` is built for Pages, whose path is not the root.
      - name: Build ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" = "portfolio" ]; then
            npx ng build portfolio --configuration production --base-href /
          else
            npx ng build ml-platform --configuration production
          fi
