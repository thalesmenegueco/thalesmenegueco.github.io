<div class="widget">
  <div class="widget-header">
    <div class="widget-title">TangentLineExplorer</div>
    <div class="widget-note">f(x) = x², ponto A em x = 2</div>
  </div>

  <app-plot-canvas [drawFn]="drawFn" />

  <div class="control-row">
    <div class="control-group">
      <label>
        <span>h: distância até B</span>
        <span class="value">{{ formatNumber(h(), 2) }}</span>
      </label>
      <input
        type="range"
        min="0.03"
        max="1.5"
        step="0.01"
        [value]="h()"
        (input)="onH($event)"
      />
    </div>
  </div>

  <div class="metric-grid">
    <div class="metric">
      <span class="metric-label">inclinação da secante</span>
      <span class="metric-value">{{ formatNumber(metrics().secantSlope) }}</span>
    </div>
    <div class="metric">
      <span class="metric-label">inclinação da tangente</span>
      <span class="metric-value">{{ formatNumber(metrics().tangentSlope) }}</span>
    </div>
    <div class="metric">
      <span class="metric-label">h</span>
      <span class="metric-value">{{ formatNumber(metrics().h, 2) }}</span>
    </div>
  </div>
</div>
