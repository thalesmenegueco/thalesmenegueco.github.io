<div class="widget">
  <div class="widget-header">
    <div class="widget-title">FormulaMatch</div>
    <div class="widget-note">Escolha a interpretação que corresponde ao que você observou</div>
  </div>

  <div class="formula-options">
    @for (option of options; track option.id) {
      <button
        type="button"
        class="formula-option"
        [class.selected]="selectedId() === option.id"
        (click)="select(option.id)"
      >
        <input
          type="radio"
          name="formula-choice"
          [checked]="selectedId() === option.id"
          (click)="select(option.id)"
        />
        <app-katex [latex]="option.latex" />
      </button>
    }
  </div>
</div>
