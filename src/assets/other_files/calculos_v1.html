<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculus I — Entender antes de memorizar</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
  />

  <style>
    :root {
      --color-bg: #0a0f10;
      --color-surface: #182023;
      --color-surface-hover: #223033;
      --color-text: #e7ece9;
      --color-text-muted: #97a6a1;
      --color-border: #33433f;
      --color-accent-warm: #ffa300;
      --color-accent-warm-soft: #e0a94f;
      --color-study-sage: #8fae9b;
      --color-study-teal: #4fb3a6;
      --color-study-sky: #7fb4d4;
      --color-accent-secondary: #b06aa3;
      --color-danger: #d87878;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 15% 0%, rgba(79, 179, 166, 0.08), transparent 35%),
        var(--color-bg);
      color: var(--color-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 310px 1fr;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 28px 20px;
      border-right: 1px solid var(--color-border);
      background: rgba(10, 15, 16, 0.88);
      backdrop-filter: blur(14px);
    }

    .brand {
      margin-bottom: 30px;
    }

    .brand-kicker {
      color: var(--color-accent-warm);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand h1 {
      margin: 7px 0 6px;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .brand p {
      margin: 0;
      color: var(--color-text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .progress-summary {
      margin-bottom: 28px;
      padding: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
    }

    .progress-summary strong {
      display: block;
      margin-bottom: 9px;
      font-size: 0.86rem;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #2b3736;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--color-study-teal),
        var(--color-study-sky)
      );
      transition: width 300ms ease;
    }

    .progress-label {
      display: block;
      margin-top: 8px;
      color: var(--color-text-muted);
      font-size: 0.78rem;
    }

    .unit-title {
      margin: 24px 9px 9px;
      color: var(--color-accent-warm-soft);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .lesson-list {
      display: grid;
      gap: 6px;
    }

    .lesson-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 10px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--color-text-muted);
      background: transparent;
      text-align: left;
      transition: 180ms ease;
    }

    .lesson-button:hover {
      background: var(--color-surface-hover);
      color: var(--color-text);
    }

    .lesson-button.active {
      border-color: rgba(79, 179, 166, 0.5);
      background: rgba(79, 179, 166, 0.1);
      color: var(--color-text);
    }

    .lesson-button.completed .lesson-number {
      color: var(--color-accent-warm);
    }

    .lesson-number {
      width: 27px;
      height: 27px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--color-border);
      border-radius: 50%;
      color: var(--color-study-sage);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .lesson-button-title {
      font-size: 0.82rem;
      line-height: 1.25;
    }

    .main {
      width: 100%;
      max-width: 1220px;
      margin: 0 auto;
      padding: 40px clamp(20px, 5vw, 68px) 80px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--color-study-teal);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .topbar h2 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2.25rem);
      line-height: 1.12;
    }

    .reset-button {
      padding: 9px 13px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      color: var(--color-text-muted);
      background: transparent;
    }

    .reset-button:hover {
      color: var(--color-text);
      background: var(--color-surface);
    }

    .scenario-card {
      margin-bottom: 24px;
      padding: clamp(20px, 4vw, 31px);
      border: 1px solid rgba(255, 163, 0, 0.28);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(255, 163, 0, 0.08), transparent 55%),
        var(--color-surface);
      box-shadow: var(--shadow);
    }

    .scenario-label {
      margin-bottom: 10px;
      color: var(--color-accent-warm);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .scenario-card p {
      max-width: 850px;
      margin: 0;
      color: var(--color-text);
      font-size: clamp(1.02rem, 2vw, 1.22rem);
      line-height: 1.65;
    }

    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 17px;
    }

    .tag {
      padding: 5px 9px;
      border: 1px solid var(--color-border);
      border-radius: 99px;
      color: var(--color-text-muted);
      font-size: 0.72rem;
    }

    .objective-list {
      margin: 21px 0 0;
      padding-left: 19px;
      color: var(--color-text-muted);
      font-size: 0.88rem;
      line-height: 1.7;
    }

    .lesson-card {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: rgba(24, 32, 35, 0.75);
      box-shadow: var(--shadow);
    }

    .step-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }

    .step-counter {
      color: var(--color-study-teal);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .step-heading h3 {
      margin: 5px 0 0;
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
    }

    .instruction {
      margin: 0 0 22px;
      color: var(--color-text-muted);
      line-height: 1.7;
    }

    .widget {
      min-height: 260px;
      margin: 19px 0;
      padding: 17px;
      border: 1px solid var(--color-border);
      border-radius: 13px;
      background: #101719;
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .widget-title {
      color: var(--color-study-sage);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .widget-note {
      color: var(--color-text-muted);
      font-size: 0.77rem;
    }

    .plot-wrap {
      position: relative;
      width: 100%;
      height: 315px;
      overflow: hidden;
      border: 1px solid #263432;
      border-radius: 10px;
      background: #0c1213;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
    }

    .control-group {
      min-width: 160px;
      flex: 1;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--color-text-muted);
      font-size: 0.78rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--color-study-teal);
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      outline: none;
      color: var(--color-text);
      background: #101719;
    }

    .value {
      color: var(--color-accent-warm);
      font-weight: 800;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .metric {
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: rgba(34, 48, 51, 0.5);
    }

    .metric-label {
      display: block;
      margin-bottom: 4px;
      color: var(--color-text-muted);
      font-size: 0.72rem;
    }

    .metric-value {
      color: var(--color-text);
      font-size: 1.12rem;
      font-weight: 800;
    }

    .table-like {
      overflow-x: auto;
      margin-top: 15px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
    }

    .approach-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .approach-table th,
    .approach-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(51, 67, 63, 0.6);
      text-align: right;
    }

    .approach-table th:first-child,
    .approach-table td:first-child {
      text-align: left;
    }

    .approach-table th {
      color: var(--color-study-sage);
      font-weight: 800;
    }

    .formula-options {
      display: grid;
      gap: 10px;
      margin-top: 17px;
    }

    .formula-option {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      color: var(--color-text);
      background: #101719;
      text-align: left;
    }

    .formula-option:hover {
      border-color: var(--color-study-teal);
      background: var(--color-surface-hover);
    }

    .formula-option.selected {
      border-color: var(--color-accent-warm);
      background: rgba(255, 163, 0, 0.08);
    }

    .formula-option input {
      accent-color: var(--color-accent-warm);
    }

    .explanation {
      margin: 22px 0 0;
      padding: 16px;
      border-left: 3px solid var(--color-study-teal);
      color: var(--color-text-muted);
      background: rgba(79, 179, 166, 0.06);
      line-height: 1.7;
    }

    .feedback {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .feedback.show {
      display: block;
    }

    .feedback.success {
      border: 1px solid rgba(143, 174, 155, 0.45);
      color: var(--color-study-sage);
      background: rgba(143, 174, 155, 0.08);
    }

    .feedback.error {
      border: 1px solid rgba(216, 120, 120, 0.45);
      color: var(--color-danger);
      background: rgba(216, 120, 120, 0.08);
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .primary-button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      color: #16100a;
      background: var(--color-accent-warm);
      font-weight: 900;
    }

    .primary-button:hover {
      background: #ffb329;
    }

    .secondary-button {
      padding: 12px 18px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      color: var(--color-text);
      background: transparent;
    }

    .secondary-button:hover {
      background: var(--color-surface-hover);
    }

    .summary-card {
      margin-top: 24px;
      padding: 25px;
      border: 1px solid rgba(176, 106, 163, 0.42);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(176, 106, 163, 0.1), transparent 60%),
        var(--color-surface);
    }

    .summary-card h3 {
      margin-top: 0;
    }

    .summary-card p {
      color: var(--color-text-muted);
      line-height: 1.7;
    }

    .summary-key {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      color: var(--color-text);
      background: rgba(176, 106, 163, 0.1);
      line-height: 1.6;
    }

    .empty-state {
      padding: 50px 20px;
      color: var(--color-text-muted);
      text-align: center;
    }

    @media (max-width: 860px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--color-border);
      }

      .lesson-list {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .main {
        padding-top: 28px;
      }
    }

    @media (max-width: 540px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .plot-wrap {
        height: 260px;
      }

      .footer-actions {
        flex-direction: column-reverse;
      }

      .footer-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-kicker">Calculus I</div>
        <h1>Entender antes de memorizar</h1>
        <p>
          Explore o problema, observe as variáveis mudarem e só então nomeie
          a ideia matemática.
        </p>
      </div>

      <div class="progress-summary">
        <strong>Seu progresso</strong>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-label" id="progressLabel">
          0 de 7 lições concluídas
        </span>
      </div>

      <nav id="lessonNavigation"></nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <p class="eyebrow" id="unitLabel">Unidade 1</p>
          <h2 id="lessonTitle">Carregando lição...</h2>
        </div>

        <button class="reset-button" id="resetProgressButton">
          Reiniciar progresso
        </button>
      </div>

      <section class="scenario-card">
        <div class="scenario-label">O problema primeiro</div>
        <p id="scenarioText"></p>
        <div class="lesson-meta" id="lessonMeta"></div>
        <ul class="objective-list" id="objectiveList"></ul>
      </section>

      <section class="lesson-card" id="lessonContent"></section>

      <section class="summary-card" id="summaryCard" hidden>
        <h3></h3>
        <p class="summary-content"></p>
        <div class="summary-key"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mathjs@14.0.1/lib/browser/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <script>
    /*
     * ============================================================
     * Modelo de dados
     * ============================================================
     *
     * Cada lição começa com um cenário concreto.
     * Os passos referenciam as variáveis desse cenário antes de
     * apresentar a formulação geral.
     */

    const lessons = [
      {
        id: "what-is-a-limit",
        unit: "Unidade 1 — Limites e continuidade",
        title: "O que é um limite?",
        description:
          "Estime a velocidade de um carro quando o velocímetro falha exatamente no ponto de interesse.",
        estimatedTime: "8 min",
        scenario:
          "Você está analisando os dados de um carro entre os marcos 2 e 3 de uma estrada. O velocímetro falhou exatamente no marco 2, mas os dados de distância ao redor desse ponto ainda estão disponíveis. Como estimar o comportamento do carro quando ele se aproxima do marco 2?",
        objectives: [
          "Interpretar aproximação como um padrão de valores.",
          "Comparar aproximações pela esquerda e pela direita.",
          "Relacionar esse padrão à notação de limite."
        ],
        steps: [
          {
            title: "Observe a aproximação",
            instruction:
              "Veja os valores da posição do carro conforme o tempo se aproxima de 2 segundos. Você não precisa saber o valor exatamente em t = 2 para observar para onde os valores estão indo.",
            widget: "limitExplorer",
            validation: {
              type: "limitTableCompletion",
              target: 4
            },
            explanation:
              "O limite descreve o valor que uma função se aproxima quando a variável se aproxima de determinado ponto. O foco não é necessariamente o valor da função no ponto, mas o comportamento ao redor dele."
          },
          {
            title: "Compare os dois lados",
            instruction:
              "Ajuste a distância da observação. Quando usamos valores menores que 2 e valores maiores que 2, os dois lados parecem se aproximar do mesmo número?",
            widget: "limitExplorer",
            validation: {
              type: "limitTableCompletion",
              target: 0.2
            },
            explanation:
              "Quando as aproximações pela esquerda e pela direita chegam ao mesmo valor, temos evidência de que o limite existe. Esse raciocínio será útil mesmo quando a função não estiver definida exatamente no ponto."
          },
          {
            title: "Dê nome ao padrão",
            instruction:
              "Agora conecte o que você observou ao símbolo matemático que representa a aproximação da posição do carro.",
            widget: "formulaMatch",
            options: [
              {
                id: "a",
                latex: String.raw`\lim_{t \to 2} s(t) = 4`,
                feedback:
                  "Correto. A posição s(t) se aproxima de 4 quando t se aproxima de 2."
              },
              {
                id: "b",
                latex: String.raw`s(2) = \lim_{t \to 4} s(t)`,
                feedback:
                  "Observe o ponto do tempo que está se aproximando: estamos indo em direção a t = 2."
              }
            ],
            validation: {
              type: "formulaMatch",
              correctAnswer: "a"
            },
            explanation:
              "A notação geral é $$\lim_{x \to a} f(x) = L$$. Ela significa que f(x) se aproxima de L quando x se aproxima de a."
          }
        ],
        summary: {
          title: "O que você aprendeu",
          content:
            "Um limite é uma forma de descrever o comportamento de uma função perto de um ponto. Ele transforma uma pergunta sobre aproximação em uma ideia matemática precisa.",
          keyTakeaway:
            "Antes de calcular um limite, pergunte: para qual valor a situação está caminhando?"
        }
      },

      {
        id: "limits-do-not-exist",
        unit: "Unidade 1 — Limites e continuidade",
        title: "Quando os limites não existem",
        description:
          "Analise um sinal que apresenta uma falha, um salto ou um crescimento sem limite.",
        estimatedTime: "8 min",
        scenario:
          "Uma estação de monitoramento recebe um sinal cuja leitura apresenta uma falha perto de t = 2. Dependendo do tipo de falha, os valores podem chegar a números diferentes pelos dois lados, ou crescer indefinidamente. Como distinguir esses casos?",
        objectives: [
          "Identificar limites laterais diferentes.",
          "Reconhecer uma assíntota vertical.",
          "Entender por que alguns limites não existem."
        ],
        steps: [
          {
            title: "Um salto no sinal",
            instruction:
              "Escolha o modo de salto e observe o que acontece quando t se aproxima de 2 pela esquerda e pela direita.",
            widget: "discontinuityExplorer",
            validation: {
              type: "modeSelection",
              target: "jump"
            },
            explanation:
              "Se o valor aproximado pela esquerda é diferente do valor aproximado pela direita, o limite bilateral não existe."
          },
          {
            title: "Uma explosão de valores",
            instruction:
              "Mude para o modo de assíntota. Observe como os valores crescem sem se aproximar de um número finito.",
            widget: "discontinuityExplorer",
            validation: {
              type: "modeSelection",
              target: "asymptote"
            },
            explanation:
              "Em uma assíntota vertical, a função pode crescer indefinidamente quando x se aproxima de um determinado valor. Dizemos que o limite diverge ou que não existe como número finito."
          },
          {
            title: "Classifique o comportamento",
            instruction:
              "Escolha a afirmação que melhor descreve o sinal no modo atualmente selecionado.",
            widget: "formulaMatch",
            options: [
              {
                id: "a",
                latex: String.raw`\lim_{x \to a^-} f(x) = \lim_{x \to a^+} f(x)`,
                feedback:
                  "Essa igualdade descreve um limite bilateral existente, não um salto."
              },
              {
                id: "b",
                latex: String.raw`\lim_{x \to a^-} f(x) \ne \lim_{x \to a^+} f(x)`,
                feedback:
                  "Correto para o salto: os dois lados se aproximam de valores diferentes."
              }
            ],
            validation: {
              type: "formulaMatch",
              correctAnswer: "b"
            },
            explanation:
              "Os limites laterais são ferramentas para investigar o que ocorre de cada lado. O limite bilateral só existe quando os dois lados concordam."
          }
        ],
        summary: {
          title: "O que você aprendeu",
          content:
            "Um limite pode falhar porque os lados não concordam ou porque os valores crescem sem se aproximar de um número finito.",
          keyTakeaway:
            "Sempre investigue separadamente o que acontece pela esquerda e pela direita."
        }
      },

      {
        id: "continuity",
        unit: "Unidade 1 — Limites e continuidade",
        title: "Continuidade",
        description:
          "Descubra quando o caminho de uma função é suave e quando existe uma quebra.",
        estimatedTime: "7 min",

    function groupLessonsByUnit() {
      return lessons.reduce((groups, lesson, index) => {
        if (!groups[lesson.unit]) groups[lesson.unit] = [];
        groups[lesson.unit].push({ lesson, index });
        return groups;
      }, {});
    }

      elements.navigation.innerHTML = "";

      Object.entries(grouped).forEach(([unit, entries]) => {
        const title = document.createElement("div");

        elements.navigation.appendChild(title);

        const list = document.createElement("div");

        entries.forEach(({ lesson, index }) => {
          const button = document.createElement("button");
          button.className = "lesson-button";

          if (index === state.currentLessonIndex) {
            button.classList.add("active");

          if (state.completedLessons.includes(lesson.id)) {
            button.classList.add("completed");

          button.innerHTML = `

            <span class="lesson-button-title">${lesson.title}</span>

          button.addEventListener("click", () => {
            state.currentLessonIndex = index;

    function renderMath(element, latex) {
      if (!element) return;

      katex.render(latex, element, {
        throwOnError: false,
        displayMode: false
      });
    }

    function formatNumber(value, decimals = 3) {
      if (!Number.isFinite(value)) return "indefinido";
      return Number(value).toFixed(decimals);
    }

    function createCanvas(container) {
      const canvas = document.createElement("canvas");
      const rect = container.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;

      canvas.width = Math.max(1, rect.width * ratio);
      canvas.height = Math.max(1, rect.height * ratio);
      canvas.style.width = "100%";
      canvas.style.height = "100%";

      const context = canvas.getContext("2d");
      context.scale(ratio, ratio);

      container.appendChild(canvas);

      return {
        canvas,
        context,
        width: rect.width,
        height: rect.height
      };
    }

    function drawCoordinateSystem(context, width, height, bounds) {
      const { xMin, xMax, yMin, yMax } = bounds;

      const xToPixel = x =>
        ((x - xMin) / (xMax - xMin)) * width;

      const yToPixel = y =>
        height - ((y - yMin) / (yMax - yMin)) * height;

      context.clearRect(0, 0, width, height);
      context.fillStyle = "#0c1213";
      context.fillRect(0, 0, width, height);

      context.strokeStyle = "rgba(151, 166, 161, 0.12)";
      context.lineWidth = 1;

      for (let x = Math.ceil(xMin); x <= xMax; x++) {
        const px = xToPixel(x);
        context.beginPath();
        context.moveTo(px, 0);
        context.lineTo(px, height);
        context.stroke();
      }

      for (let y = Math.ceil(yMin); y <= yMax; y++) {
        const py = yToPixel(y);
        context.beginPath();
        context.moveTo(0, py);
        context.lineTo(width, py);
        context.stroke();
      }

      context.strokeStyle = "rgba(231, 236, 233, 0.5)";
      context.lineWidth = 1.2;

      if (yMin <= 0 && yMax >= 0) {
        const py = yToPixel(0);
        context.beginPath();
        context.moveTo(0, py);
        context.lineTo(width, py);
        context.stroke();
      }

      if (xMin <= 0 && xMax >= 0) {
        const px = xToPixel(0);
        context.beginPath();
        context.moveTo(px, 0);
        context.lineTo(px, height);
        context.stroke();
      }

      return { xToPixel, yToPixel };
    }

    function drawFunction(context, width, height, bounds, fn, color, lineWidth = 2.5) {
      const { xMin, xMax } = bounds;
      const { xToPixel, yToPixel } =
        drawCoordinateSystem.bind(null, context, width, height, bounds);

      context.save();
      context.strokeStyle = color;
      context.lineWidth = lineWidth;
      context.beginPath();

      let started = false;

      for (let i = 0; i <= width; i++) {
        const x = xMin + (i / width) * (xMax - xMin);
        let y;

        try {
          y = fn(x);
        } catch {
          y = NaN;
        }

        if (!Number.isFinite(y)) {
          started = false;
          continue;
        }

        const px = xToPixel(x);
        const py = yToPixel(y);

        if (py < -height * 3 || py > height * 4) {
          started = false;
          continue;
        }

        if (!started) {
          context.moveTo(px, py);
          started = true;
        } else {
          context.lineTo(px, py);
        }
      }

      context.stroke();
      context.restore();

      return { xToPixel, yToPixel };
    }

    function drawPoint(context, x, y, color, radius = 6) {
      context.beginPath();
      context.arc(x, y, radius, 0, Math.PI * 2);
      context.fillStyle = color;
      context.fill();
      context.strokeStyle = "#0c1213";
      context.lineWidth = 2;
      context.stroke();
    }

    function renderLimitExplorer(container) {
      const widget = createWidgetShell(
        "LimitExplorer",
        "Aproximação pela esquerda e pela direita"
      );

      const plotWrap = document.createElement("div");
      plotWrap.className = "plot-wrap";
      widget.appendChild(plotWrap);

      const table = document.createElement("div");
      table.className = "table-like";
      widget.appendChild(table);

      const controls = document.createElement("div");
      controls.className = "control-row";
      controls.innerHTML = `
        <div class="control-group">
          <label>
            <span>Distância até t = 2</span>
            <span class="value" data-distance-value>0.80</span>
          </label>
          <input type="range" min="0.05" max="1" value="0.8" step="0.05" data-distance />
        </div>
      `;
      widget.appendChild(controls);

      const canvasState = createCanvas(plotWrap);

      function draw() {
        const distance = Number(controls.querySelector("[data-distance]").value);
        controls.querySelector("[data-distance-value]").textContent =
          distance.toFixed(2);

        const bounds = {
          xMin: 0.4,
          xMax: 3.6,
          yMin: 0,
          yMax: 8
        };

        const { context, width, height } = canvasState;
        const axis = drawCoordinateSystem(context, width, height, bounds);
        const fn = x => x * x;

        context.strokeStyle = varColor("--color-study-sky");
        context.lineWidth = 3;
        context.beginPath();

        let started = false;

        for (let i = 0; i <= width; i++) {
          const x = bounds.xMin +
            (i / width) * (bounds.xMax - bounds.xMin);
          const y = fn(x);
          const px = axis.xToPixel(x);
          const py = axis.yToPixel(y);

          if (!started) {
            context.moveTo(px, py);
            started = true;
          } else {
            context.lineTo(px, py);
          }
        }

        context.stroke();

        const leftX = 2 - distance;
        const rightX = 2 + distance;
        const pointX = axis.xToPixel(2);
        const pointY = axis.yToPixel(fn(2));

        context.setLineDash([5, 5]);
        context.strokeStyle = varColor("--color-accent-warm");
        context.beginPath();
        context.moveTo(pointX, 0);
        context.lineTo(pointX, height);
        context.stroke();
        context.setLineDash([]);

        drawPoint(
          context,
          axis.xToPixel(leftX),
          axis.yToPixel(fn(leftX)),
          varColor("--color-study-teal")
        );

        drawPoint(
          context,
          axis.xToPixel(rightX),
          axis.yToPixel(fn(rightX)),
          varColor("--color-accent-secondary")
        );

        drawPoint(context, pointX, pointY, varColor("--color-accent-warm"));

        const rows = [

      `;

      function draw() {
        const mode = controls.querySelector("select").value;
        state.widgetState.discontinuityMode = mode;

        const bounds = {
          xMin: -1,
          xMax: 5,
          yMin: -5,
          yMax: 8

        const axis = drawCoordinateSystem(context, width, height, bounds);

        context.strokeStyle = varColor("--color-study-sky");

        context.beginPath();

        for (let i = 0; i <= width; i++) {
          const x = bounds.xMin +
            (i / width) * (bounds.xMax - bounds.xMin);

          let y;

          if (mode === "jump") {
            y = x < 2 ? 2 : 5;
          } else {
            y = 1 / (x - 2);
          }

          if (!Number.isFinite(y)) continue;

          const px = axis.xToPixel(x);
          const py = axis.yToPixel(y);

          if (i === 0 || Math.abs(x - 2) < 0.025) {
            context.moveTo(px, py);
          } else {
            context.lineTo(px, py);
          }
        }

        context.stroke();

        context.setLineDash([5, 5]);
        context.strokeStyle = varColor("--color-accent-warm");
        context.beginPath();
        context.moveTo(axis.xToPixel(2), 0);
        context.lineTo(axis.xToPixel(2), height);
        context.stroke();
        context.setLineDash([]);
      }

      controls.querySelector("select").addEventListener("change", draw);

    function drawLine(
      context,
      width,
      height,
      axis,
      bounds,
      fn,
      color,
      lineWidth = 2
    ) {
      context.save();
      context.strokeStyle = color;
      context.lineWidth = lineWidth;
      context.beginPath();

      let started = false;

      for (let i = 0; i <= width; i++) {
        const x =
          bounds.xMin +
          (i / width) * (bounds.xMax - bounds.xMin);

        let y;

        try {
          y = fn(x);
        } catch {
          y = NaN;
        }

        if (!Number.isFinite(y)) {
          started = false;
          continue;
        }

        const px = axis.xToPixel(x);
        const py = axis.yToPixel(y);

        if (py < -height * 3 || py > height * 4) {
          started = false;
          continue;
        }

        if (!started) {
          context.moveTo(px, py);
          started = true;
        } else {
          context.lineTo(px, py);
        }
      }

      context.stroke();
      context.restore();
    }

    function renderWidget(type, step) {
      const container = document.createElement("div");

      switch (type) {
        case "limitExplorer":

          );
      }

    /*
     * ============================================================
     * Validação da etapa
     * ============================================================
     */

    function validateStep(step) {
      const validation = step.validation;

      if (!validation) return true;

      switch (validation.type) {
        case "formulaMatch":
          return state.widgetState.formulaAnswer === validation.correctAnswer;

        case "limitTableCompletion":
          return true;

        case "modeSelection":
          return state.widgetState.discontinuityMode === validation.target;

        case "continuityToggle":
          return state.widgetState.continuityMode === validation.target;

        case "range": {
          const current =
            state.widgetState.averageSlopeB ??
            state.widgetState.tangentH ??
            state.widgetState.derivativeX;

          if (!Number.isFinite(current)) return false;

          return (
            current >= validation.targetRange[0] &&
            current <= validation.targetRange[1]
          );
        }

        case "positiveDerivative":
          return (state.widgetState.derivativeX ?? 0) > 0;

        case "ruleSelection":
          return state.widgetState.rule === validation.target;

        default:
          return true;
      }
    }

    function validationMessage(step) {
      const type = step.validation?.type;

      const messages = {
        formulaMatch: "Escolha uma fórmula antes de continuar.",
        modeSelection:
          "Explore o comportamento solicitado no controle do widget.",
        continuityToggle:
          "Alterne o estado da função para o modo indicado na instrução.",
        range:
          "Aproxime o controle da faixa indicada e observe novamente.",
        positiveDerivative:
          "Mova o ponto para uma região em que a derivada seja positiva.",
        ruleSelection:
          "Selecione a estrutura matemática indicada na instrução."
      };

      return messages[type] || "Explore o widget e tente novamente.";
    }

    function renderLesson() {
      const lesson = currentLesson();
      const step = currentStep();

      elements.unitLabel.textContent = lesson.unit;
      elements.lessonTitle.textContent = lesson.title;
      elements.scenarioText.textContent = lesson.scenario;

      elements.lessonMeta.innerHTML = `
        <span class="tag">${lesson.estimatedTime}</span>
        <span class="tag">${lesson.steps.length} etapas</span>
        <span class="tag">Aprendizagem por descoberta</span>
      `;

      elements.objectiveList.innerHTML = lesson.objectives
        .map(objective => `<li>${objective}</li>`)
        .join("");

      elements.lessonContent.innerHTML = "";

      const heading = document.createElement("div");
      heading.className = "step-heading";
      heading.innerHTML = `
        <div>
          <div class="step-counter">
            Etapa ${state.currentStepIndex + 1} de ${lesson.steps.length}
          </div>
          <h3>${step.title}</h3>
        </div>
      `;

      const instruction = document.createElement("p");
      instruction.className = "instruction";
      instruction.textContent = step.instruction;

      const widget = renderWidget(step.widget, step);

      const explanation = document.createElement("div");
      explanation.className = "explanation";
      explanation.innerHTML = step.explanation.replace(
        /\$\$(.*?)\$\$/gs,
        (_, formula) => `<span class="formula"></span>`
      );

      const formulaMatches = [...step.explanation.matchAll(/\$\$(.*?)\$\$/gs)];
      formulaMatches.forEach((match, index) => {
        const formulaElement = explanation.querySelectorAll(".formula")[index];
        renderMath(formulaElement, match[1]);
      });

      const feedback = document.createElement("div");
      feedback.className = "feedback";
      feedback.dataset.feedback;

      const actions = document.createElement("div");
      actions.className = "footer-actions";

      const backButton = document.createElement("button");
      backButton.className = "secondary-button";
      backButton.textContent = "Etapa anterior";
      backButton.disabled = state.currentStepIndex === 0;
      backButton.addEventListener("click", () => {
        state.currentStepIndex--;
        state.widgetState = {};
        renderApp();
      });

      const nextButton = document.createElement("button");
      nextButton.className = "primary-button";
      nextButton.textContent =
        state.currentStepIndex === lesson.steps.length - 1
          ? "Concluir lição"
          : "Continuar";

      nextButton.addEventListener("click", () => {
        if (!validateStep(step)) {
          feedback.className = "feedback show error";
          feedback.textContent = validationMessage(step);
          return;
        }

        if (state.currentStepIndex < lesson.steps.length - 1) {
          state.currentStepIndex++;
          state.widgetState = {};
          renderApp();
          return;
        }

        if (!state.completedLessons.includes(lesson.id)) {
          state.completedLessons.push(lesson.id);
          saveProgress();
        }

        renderNavigation();
        updateProgress();
        renderSummary();
      });

      actions.append(backButton, nextButton);

      elements.lessonContent.append(
        heading,
        instruction,
        widget,
        explanation,
        feedback,
        actions
      );

      elements.summaryCard.hidden = true;
    }

    function renderSummary() {
      const lesson = currentLesson();

      elements.summaryCard.hidden = false;
      elements.summaryCard.querySelector("h3").textContent =
        lesson.summary.title;
      elements.summaryCard.querySelector(".summary-content").textContent =
        lesson.summary.content;
      elements.summaryCard.querySelector(".summary-key").textContent =
        lesson.summary.keyTakeaway;

      window.scrollTo({
        top: elements.summaryCard.offsetTop - 30,
        behavior: "smooth"
      });
    }

    function renderApp() {
      renderNavigation();
      updateProgress();
      renderLesson();
    }

    function varColor(variable) {
      return getComputedStyle(document.documentElement)
        .getPropertyValue(variable)
        .trim();
    }

    elements.resetProgressButton.addEventListener("click", () => {
      const confirmed = window.confirm(
        "Reiniciar todo o progresso desta aplicação?"
      );

      if (!confirmed) return;

      state.completedLessons = [];
      state.currentLessonIndex = 0;
      state.currentStepIndex = 0;
      state.widgetState = {};
      saveProgress();
      renderApp();
    });

    window.addEventListener("resize", () => {
      renderLesson();
    });

    renderApp();
  </script>
</body>
</html>
